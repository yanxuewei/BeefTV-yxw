services:
  backend:
    image: beeftv-backend:local
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
    # /api/ops 与 /api/assistant/* 只接受 RemoteAddr 为回环的请求。桥接网络下 nginx 反代
    # 来源是 172.x，助手状态与画布保存都会 403。本机自用改为 host 网络，与 web 共享宿主回环。
    network_mode: host
    environment:
      CANVAS_LOCAL_MODE: "true"
      # 只绑宿主回环，同网络命名空间的 web 反代仍可访问，局域网不可见。
      CANVAS_BACKEND_ADDR: "127.0.0.1:8080"
      # 服务端形态没有桌面壳凭据：后端把本机同源的浏览器请求按工作区本机用户处理，
      # 无需再打开 BEEFTV_UI_BOOTSTRAP 之类的手工引导开关。
      CANVAS_BACKEND_DATA_DIR: /data
      CANVAS_SHUTDOWN_TIMEOUT: ${CANVAS_SHUTDOWN_TIMEOUT:-10m}
      CANVAS_DATABASE_DRIVER: ${CANVAS_DATABASE_DRIVER:-sqlite}
      CANVAS_WORKER_CONCURRENCY: ${CANVAS_WORKER_CONCURRENCY:-3}
      CANVAS_CHANNEL_CONCURRENCY: ${CANVAS_CHANNEL_CONCURRENCY:-3}
      CANVAS_REGISTRATION_ENABLED: ${CANVAS_REGISTRATION_ENABLED:-false}
      CANVAS_ALLOW_PRIVATE_UPSTREAMS: ${CANVAS_ALLOW_PRIVATE_UPSTREAMS:-true}
      CANVAS_ALLOWED_PRIVATE_UPSTREAM_HOSTS: ${CANVAS_ALLOWED_PRIVATE_UPSTREAM_HOSTS:-}
      CANVAS_CORS_ORIGINS: ${CANVAS_CORS_ORIGINS:-http://localhost:3000}
      ENABLE_PROVIDER_PLUGINS: ${ENABLE_PROVIDER_PLUGINS:-false}
      GIN_MODE: release
    volumes:
      - backend-data:/data
    restart: unless-stopped
    stop_grace_period: ${CANVAS_SHUTDOWN_TIMEOUT:-10m}
    develop:
      watch:
        - action: rebuild
          path: ./backend
          ignore:
            - data/

  web:
    image: beeftv-web:local
    build:
      context: .
      dockerfile: Dockerfile
    # host 网络下端口映射被忽略，nginx 的 listen 3000 直接监听宿主。
    network_mode: host
    extra_hosts:
      # nginx.conf 的 proxy_pass http://backend:8080 在 host 网络下指向本机回环。
      - "backend:127.0.0.1"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    develop:
      watch:
        - action: rebuild
          path: ./web
          ignore:
            - node_modules/
            - dist/
            - tsconfig.tsbuildinfo
        - action: rebuild
          path: ./Dockerfile
        - action: rebuild
          path: ./nginx.conf
        - action: rebuild
          path: ./VERSION
        - action: rebuild
          path: ./CHANGELOG.md

volumes:
  backend-data:
